<!doctype html>
<html lang="uk" data-title-key="meta.men">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>PRYSMERK</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M12 24V8h5.5a4.5 4.5 0 0 1 0 9H12' fill='none' stroke='%23ede8e0' stroke-width='1.6'/%3E%3C/svg%3E">
  <!-- Шрифты лежат на сайте (fonts/), без запроса к внешнему серверу. preload: браузер начинает качать их сразу. -->
  <link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-cyrillic-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <!-- Данные товаров: начинаем грузить сразу, не дожидаясь скриптов -->
  <link rel="preload" href="data/products.json" as="fetch" crossorigin>

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glow.css">
  <link rel="stylesheet" href="css/section.css">
</head>
<body data-section="men" data-async>
  <!-- Какой раздел открыт, берём из адреса: section.html?s=men|women|kids.
       Делаем это сразу, до отрисовки, чтобы свечение сразу было нужного цвета. -->
  <script>
    (function () {
      var ok = ["men", "women", "kids"];
      var s = new URLSearchParams(location.search).get("s");
      if (ok.indexOf(s) === -1) s = "men";
      document.body.setAttribute("data-section", s);
      document.documentElement.setAttribute("data-title-key", "meta." + s);
    })();
  </script>

  <!-- Свечение фона: один слой, вне main, поэтому не гаснет при переходах -->
  <div class="glow-layer" aria-hidden="true"></div>

  <main class="section-page">
    <header class="section-head">
      <h1 class="section-title" id="section-title"></h1>
      <button class="filters-btn glass-btn" id="filters-open" type="button" aria-haspopup="dialog" aria-controls="filters">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 8h9"/><path d="M17 8h3"/><circle cx="15" cy="8" r="2"/><path d="M4 16h3"/><path d="M11 16h9"/><circle cx="9" cy="16" r="2"/></svg>
        <span data-i18n="filters.button">Сортування і фільтри</span>
        <span class="filters-btn__count" id="filters-count" hidden></span>
      </button>
    </header>

    <p class="catalog-status" id="catalog-status" role="status" hidden></p>
    <button class="btn catalog-retry" id="catalog-retry" type="button" hidden data-i18n="status.retry">Спробувати ще раз</button>
    <div id="catalog"></div>
  </main>

  <!-- Панель сортування і фільтрів -->
  <div class="modal" id="filters" role="dialog" aria-modal="true" aria-labelledby="filters-title" inert>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel glass">
      <div class="modal__head">
        <h2 class="modal__title" id="filters-title" data-i18n="filters.title">Сортування і фільтри</h2>
        <button class="modal__close glass-btn" type="button" data-close data-i18n-aria="filters.close" aria-label="Закрити">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="modal__body">
        <fieldset class="group">
          <legend data-i18n="filters.sort">Сортування</legend>
          <div class="chips" id="sort-chips">
            <button class="chip" type="button" data-sort="asc" aria-pressed="false" data-i18n="filters.sort.asc">Ціна: від меншої до більшої</button>
            <button class="chip" type="button" data-sort="desc" aria-pressed="false" data-i18n="filters.sort.desc">Ціна: від більшої до меншої</button>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="filters.color">Колір</legend>
          <div class="chips" id="color-chips"></div>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="filters.size">Розмір</legend>
          <div class="chips" id="size-chips"></div>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="filters.price">Ціна</legend>
          <div class="price-fields">
            <label class="field">
              <span class="field__label" data-i18n="filters.from">Від</span>
              <span class="field__box">
                <input class="field__input" id="price-min" type="text" inputmode="numeric" autocomplete="off" maxlength="6" spellcheck="false">
                <span class="field__unit" data-currency></span>
              </span>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="filters.to">До</span>
              <span class="field__box">
                <input class="field__input" id="price-max" type="text" inputmode="numeric" autocomplete="off" maxlength="6" spellcheck="false">
                <span class="field__unit" data-currency></span>
              </span>
            </label>
          </div>
          <p class="field-error" id="price-error" role="alert" hidden data-i18n="filters.price.error"></p>
        </fieldset>
      </div>

      <div class="modal__foot">
        <button class="btn btn--ghost" type="button" id="filters-reset" data-i18n="filters.reset">Скинути</button>
        <button class="btn" type="button" id="filters-apply" data-close></button>
      </div>
    </div>
  </div>

  <!-- Порядок важен: переводы, язык, каркас, переходы, окна, каталог -->
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/glow-engine.js"></script>
  <script src="js/glow.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
